name: Release Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform, build tools and NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install Linux dependencies for Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches application versions
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          test "$EXPECTED" = "$PACKAGE_VERSION"
          test "$EXPECTED" = "$TAURI_VERSION"
          test "$EXPECTED" = "$CARGO_VERSION"

      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VOID_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VOID_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOID_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOID_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.VOID_ANDROID_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$CERT_SHA256"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/void-release.jks"
          chmod 600 "$RUNNER_TEMP/void-release.jks"

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build and typecheck frontend
        run: npm run build

      - name: Test and lint Rust core
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run repository quality-gate tests
        run: npm run test:e2e

      - name: Build signed Tauri Android APK
        env:
          VOID_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/void-release.jks
          VOID_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VOID_ANDROID_KEYSTORE_PASSWORD }}
          VOID_ANDROID_KEY_ALIAS: ${{ secrets.VOID_ANDROID_KEY_ALIAS }}
          VOID_ANDROID_KEY_PASSWORD: ${{ secrets.VOID_ANDROID_KEY_PASSWORD }}
        run: |
          npm run tauri android build -- --target aarch64
          cd src-tauri/gen/android
          ./gradlew testReleaseUnitTest

      - name: Prepare, verify signer and checksum APK
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.VOID_ANDROID_CERT_SHA256 }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk Void.apk
          scripts/verify_android_release.sh Void.apk
          ACTUAL_CERT_SHA256="$(apksigner verify --print-certs Void.apk 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          NORMALIZED_EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_CERT_SHA256" = "$NORMALIZED_EXPECTED"
          sha256sum Void.apk > Void.apk.sha256
          test -s Void.apk
          test -s Void.apk.sha256

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Void.apk
            Void.apk.sha256
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
