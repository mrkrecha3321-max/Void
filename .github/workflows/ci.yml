name: Continuous Integration

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test
      - name: Lint Rust core
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Run repository tests
        run: npm run test:contract-model

  android-debug-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-linux-android
      - name: Cache Rust Android build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android-x86_64
          cache-on-failure: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android platform, build tools and NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build x86_64 debug APK
        run: npm run tauri android build -- --debug --target x86_64
      - name: Run Kotlin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew testDebugUnitTest
      - name: Compile Android instrumentation smoke tests
        working-directory: src-tauri/gen/android
        run: ./gradlew assembleDebugAndroidTest
